name: Cogito
description: Cogito Corp was a Boston-based real-time artificial-intelligence company that provided
  emotional-intelligence and conversation-guidance software for contact-center agents, analyzing voice
  signals during live phone calls to coach agents in the moment and surface customer-experience and
  agent-wellbeing insights. Surfaced in the API Evangelist network as a portfolio-company lead (backed by
  Battery Ventures), Cogito's primary domain cogitocorp.com now 301-redirects to verint.com and its
  developer subdomains no longer resolve, reflecting the product's absorption into Verint's customer-
  experience automation portfolio. Cogito no longer operates an independent public developer or API
  surface; this record is retained as an identity and acquisition profile. The enrichment pass found no
  standalone Cogito public API, OpenAPI, documentation, developer portal, SDK, or well-known surface to
  catalog.
